# push / PR ごとに lint・テスト・秘密の全履歴スキャンを行う。
# sitemill は public なので、既定の github.token で checkout できる。
name: checks

on:
  push:
    branches: [main]
    # pipeline がデータだけをコミットするときは checks を走らせない（Actions 無料枠の節約）。
    # コードや設定の変更では従来どおり走る。
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 保存済み HTML は非公開の ops 側にある。fork からの PR には Secret が渡らないので、
      # そのときは checkout を飛ばし、該当の試験は skip される（tests/fixtures/README.md）
      OPS_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: akiya-atlas
          fetch-depth: 0 # 履歴スキャンのため全履歴を取る
      - uses: actions/checkout@v4
        with:
          repository: hikuzawa/sitemill
          ref: v0.7.14 # タグ固定（ADR 0006）。sitemill の main の変更は自動では入らない
          path: sitemill
      - name: Checkout akiya-atlas-ops（保存済み HTML。private）
        if: env.OPS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: hikuzawa/akiya-atlas-ops
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops
      - name: 保存済み HTML を所定の位置へ（git 管理外）
        if: env.OPS_TOKEN != ''
        run: cp -r ops/fixtures/html akiya-atlas/tests/fixtures/html
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: akiya-atlas
        run: uv sync --frozen
      - working-directory: akiya-atlas
        run: uv run ruff check src tests
      - working-directory: akiya-atlas
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: akiya-atlas
        run: node --test tests/coastal_ui.test.cjs
      - name: Secret scan (全履歴)
        working-directory: akiya-atlas
        run: uv run sitemill scan-secrets --history

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The action wrapper requires an organization license. The MIT CLI performs
      # the same secret scan without that wrapper; keep full history and fail on leaks.
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify the narrow source-ID exception
        run: python3 .github/scripts/check_gitleaks_config.py "$RUNNER_TEMP/gitleaks"
      - name: Scan all Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all --full-history"'
